name: Deploy HRM Mobile App Download Page

on:
  push:
    paths:
      - 'app-download-page/**'
      - 'HRMobile-release.apk'
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to hrzio.com/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create remote directory
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}"

      - name: Deploy files via SCP
        run: |
          scp app-download-page/index.html ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          scp app-download-page/HRMobile-release.apk ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Set file permissions
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "chmod 644 ${{ secrets.DEPLOY_PATH }}/*"

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "Access the download page at: https://${{ secrets.SSH_HOST }}/app/"

      - name: Send deployment notification
        if: success()
        run: |
          echo "Successfully deployed HRM Mobile App download page"
          echo "Version: $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "Deployment failed. Please check the logs."
