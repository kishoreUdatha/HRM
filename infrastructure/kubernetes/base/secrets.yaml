# ===========================================
# HRM Secrets - Use Azure Key Vault in Production
# This file is for reference only - secrets should be managed via:
# 1. Azure Key Vault with CSI Driver
# 2. External Secrets Operator
# 3. Sealed Secrets
# ===========================================

apiVersion: v1
kind: Secret
metadata:
  name: hrm-secrets
  namespace: hrm-production
  labels:
    app.kubernetes.io/name: hrm
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database - Use Azure Key Vault reference in production
  MONGODB_URI: "REPLACE_WITH_COSMOS_DB_CONNECTION_STRING"

  # Redis - Use Azure Key Vault reference in production
  REDIS_URL: "REPLACE_WITH_REDIS_CONNECTION_STRING"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"

  # RabbitMQ
  RABBITMQ_URL: "amqp://hrm_admin:REPLACE_PASSWORD@rabbitmq-service:5672"
  RABBITMQ_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

  # JWT Secrets - Generate using: openssl rand -base64 64
  JWT_ACCESS_SECRET: "REPLACE_WITH_64_CHAR_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_64_CHAR_SECRET"

  # Email
  SMTP_USER: "apikey"
  SMTP_PASS: "REPLACE_WITH_SENDGRID_API_KEY"

  # Azure Storage
  AZURE_STORAGE_ACCOUNT_KEY: "REPLACE_WITH_STORAGE_KEY"
  AZURE_STORAGE_CONNECTION_STRING: "REPLACE_WITH_CONNECTION_STRING"

  # OpenAI
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_KEY"

  # Razorpay
  RAZORPAY_KEY_ID: "REPLACE_WITH_KEY_ID"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_KEY_SECRET"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_WITH_WEBHOOK_SECRET"

  # Application Insights
  APPINSIGHTS_INSTRUMENTATIONKEY: "REPLACE_WITH_INSTRUMENTATION_KEY"
---
# Azure Key Vault Secret Provider Class
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hrm-azure-keyvault
  namespace: hrm-production
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Set to the User-assigned identity Client ID
    keyvaultName: "hrm-production-kv"
    tenantId: "REPLACE_WITH_TENANT_ID"
    objects: |
      array:
        - |
          objectName: jwt-access-secret
          objectType: secret
        - |
          objectName: jwt-refresh-secret
          objectType: secret
        - |
          objectName: mongodb-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: storage-connection-string
          objectType: secret
  secretObjects:
    - secretName: hrm-keyvault-secrets
      type: Opaque
      data:
        - objectName: jwt-access-secret
          key: JWT_ACCESS_SECRET
        - objectName: jwt-refresh-secret
          key: JWT_REFRESH_SECRET
        - objectName: mongodb-connection-string
          key: MONGODB_URI
        - objectName: redis-connection-string
          key: REDIS_URL
        - objectName: rabbitmq-password
          key: RABBITMQ_PASSWORD
        - objectName: storage-connection-string
          key: AZURE_STORAGE_CONNECTION_STRING
