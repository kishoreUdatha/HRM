# ===========================================
# HRM Secrets - Use Azure Key Vault in Production
# This file is for reference only - secrets should be managed via:
# 1. Azure Key Vault with CSI Driver
# 2. External Secrets Operator
# 3. Sealed Secrets
# 4. Environment variables from .env file (development)
# ===========================================

apiVersion: v1
kind: Secret
metadata:
  name: hrm-secrets
  namespace: hrm-production
  labels:
    app.kubernetes.io/name: hrm
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database - Use environment variable or Azure Key Vault
  MONGODB_URI: "${COSMOSDB_URI}"

  # Redis
  REDIS_URL: "${REDIS_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # RabbitMQ
  RABBITMQ_URL: "${RABBITMQ_URL}"
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"

  # JWT Secrets
  JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"

  # Email
  SMTP_USER: "${SMTP_USER}"
  SMTP_PASS: "${SMTP_PASS}"

  # Azure Storage
  AZURE_STORAGE_ACCOUNT_KEY: "${AZURE_STORAGE_ACCOUNT_KEY}"
  AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING}"

  # OpenAI
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # Razorpay
  RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
  RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
  RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"

  # Application Insights
  APPINSIGHTS_INSTRUMENTATIONKEY: "${APPINSIGHTS_INSTRUMENTATIONKEY}"
---
# Azure Key Vault Secret Provider Class
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hrm-azure-keyvault
  namespace: hrm-production
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Set to the User-assigned identity Client ID
    keyvaultName: "${AZURE_KEYVAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: jwt-access-secret
          objectType: secret
        - |
          objectName: jwt-refresh-secret
          objectType: secret
        - |
          objectName: mongodb-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: storage-connection-string
          objectType: secret
  secretObjects:
    - secretName: hrm-keyvault-secrets
      type: Opaque
      data:
        - objectName: jwt-access-secret
          key: JWT_ACCESS_SECRET
        - objectName: jwt-refresh-secret
          key: JWT_REFRESH_SECRET
        - objectName: mongodb-connection-string
          key: MONGODB_URI
        - objectName: redis-connection-string
          key: REDIS_URL
        - objectName: rabbitmq-password
          key: RABBITMQ_PASSWORD
        - objectName: storage-connection-string
          key: AZURE_STORAGE_CONNECTION_STRING
