# ===========================================
# HRM All Microservices Deployment
# ===========================================

# Auth Service
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hrm-production
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hrm-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: hrm-service-account
      containers:
        - name: auth-service
          image: ${ACR_LOGIN_SERVER}/hrm/auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: hrm-config
          env:
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: MONGODB_URI
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: JWT_REFRESH_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5

