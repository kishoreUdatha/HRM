# ===========================================
# HRM Microservice Template
# Replace ${SERVICE_NAME}, ${SERVICE_PORT}, ${DATABASE_NAME}
# ===========================================

apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: hrm-production
  labels:
    app: ${SERVICE_NAME}
    app.kubernetes.io/name: ${SERVICE_NAME}
spec:
  type: ClusterIP
  ports:
    - port: ${SERVICE_PORT}
      targetPort: ${SERVICE_PORT}
      protocol: TCP
      name: http
  selector:
    app: ${SERVICE_NAME}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: hrm-production
  labels:
    app: ${SERVICE_NAME}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "${SERVICE_PORT}"
    spec:
      serviceAccountName: hrm-service-account
      containers:
        - name: ${SERVICE_NAME}
          image: ${ACR_LOGIN_SERVER}/hrm/${SERVICE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: ${SERVICE_PORT}
          envFrom:
            - configMapRef:
                name: hrm-config
          env:
            - name: PORT
              value: "${SERVICE_PORT}"
            - name: SERVICE_NAME
              value: "${SERVICE_NAME}"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: MONGODB_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: RABBITMQ_URL
            - name: APPINSIGHTS_INSTRUMENTATIONKEY
              valueFrom:
                secretKeyRef:
                  name: hrm-secrets
                  key: APPINSIGHTS_INSTRUMENTATIONKEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: ${SERVICE_PORT}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: ${SERVICE_PORT}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ${SERVICE_NAME}
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${SERVICE_NAME}-hpa
  namespace: hrm-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${SERVICE_NAME}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
