# Nginx Load Balancer Configuration for Load Testing
# Optimized for high concurrency and connection reuse

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # Keep-alive optimization
    keepalive_timeout 120s;
    keepalive_requests 10000;

    # Connection limits - relaxed for load testing
    limit_conn_zone $binary_remote_addr zone=conn_limit:50m;
    limit_req_zone $binary_remote_addr zone=req_limit:50m rate=1000r/s;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 32k;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Upstream - API Gateway cluster with load balancing
    upstream api_gateway {
        least_conn;
        keepalive 100;

        # Multiple API Gateway instances
        server api-gateway:3000 weight=1 max_fails=3 fail_timeout=30s;
        # Additional instances will be added dynamically by Docker Compose scaling
    }

    # Upstream - Auth Service cluster
    upstream auth_service {
        least_conn;
        keepalive 50;
        server auth-service:3001 weight=1 max_fails=3 fail_timeout=30s;
    }

    # Upstream - Attendance Service cluster (handles spikes)
    upstream attendance_service {
        least_conn;
        keepalive 50;
        server attendance-service:3004 weight=1 max_fails=3 fail_timeout=30s;
    }

    # Logging format with timing
    log_format loadtest '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Main server block
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        access_log /var/log/nginx/access.log loadtest;
        error_log /var/log/nginx/error.log warn;

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Gateway proxy
        location /api {
            # Connection limits - very relaxed for load testing
            limit_conn conn_limit 1000;
            limit_req zone=req_limit burst=2000 nodelay;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;

            # Keep-alive to upstream
            proxy_set_header Connection "";

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;

            # Error handling
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # WebSocket support
        location /ws {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Static files (if any)
        location /static {
            alias /var/www/static;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Status page for monitoring
    server {
        listen 8080;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
