# ===========================================
# HRM Mobile App - Android APK Build & Deploy
# ===========================================
# Builds release APK when mobile-app changes are pushed
# Deploys APK to hrzio.com/app download page

name: Build Mobile App

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'mobile-app/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without changes'
        required: false
        default: 'true'
        type: boolean

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Create local.properties
        working-directory: mobile-app/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        working-directory: mobile-app/android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version info
        id: version
        working-directory: mobile-app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +'%B %d, %Y')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv mobile-app/android/app/build/outputs/apk/release/app-release.apk mobile-app/android/app/build/outputs/apk/release/HRMobile-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRMobile-release
          path: mobile-app/android/app/build/outputs/apk/release/HRMobile-release.apk
          retention-days: 30

      - name: Update app-download-page
        run: |
          # Copy the new APK to app-download-page
          cp mobile-app/android/app/build/outputs/apk/release/HRMobile-release.apk app-download-page/HRMobile-release.apk

          # Update version and date in index.html
          sed -i 's/<div class="version-number" id="version">.*<\/div>/<div class="version-number" id="version">${{ steps.version.outputs.version }}<\/div>/' app-download-page/index.html
          sed -i 's/<div class="build-date" id="build-date">.*<\/div>/<div class="build-date" id="build-date">Built on: ${{ steps.version.outputs.date }}<\/div>/' app-download-page/index.html

      - name: Commit updated APK
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app-download-page/HRMobile-release.apk app-download-page/index.html
          git diff --staged --quiet || git commit -m "Update mobile app APK to v${{ steps.version.outputs.version }}

          Built on: ${{ steps.version.outputs.date }}
          Commit: ${{ github.sha }}

          Co-Authored-By: GitHub Actions <action@github.com>"
          git push

  deploy-app-page:
    name: Deploy App Download Page
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master  # Get the latest with updated APK

      - name: Pull latest changes
        run: git pull origin master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://hrm-production-gateway.thankfulriver-4edafef0.centralindia.azurecontainerapps.io/api
        run: npm run build

      - name: Copy app download page to frontend dist
        run: |
          mkdir -p frontend/dist/app
          cp app-download-page/index.html frontend/dist/app/
          cp app-download-page/HRMobile-release.apk frontend/dist/app/
          echo "App download page copied to frontend/dist/app/"
          ls -la frontend/dist/app/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          skip_app_build: true
