# ===========================================
# HRM SaaS Platform - Azure Container Apps CI/CD
# ===========================================
# Deploys to Azure Container Apps (Central India - Terraform managed)
# Infrastructure is managed by Terraform in /infrastructure/terraform

name: Deploy to Azure

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all services'
        required: false
        default: 'true'
        type: boolean

env:
  # Terraform-deployed resources (Central India)
  AZURE_RESOURCE_GROUP: hrm-production-rg
  ACR_NAME: hrmproductionacrohshda
  ACR_LOGIN_SERVER: hrmproductionacrohshda.azurecr.io
  CONTAINER_APP_ENV: hrm-production-env
  LOCATION: centralindia

  # Production URLs
  API_URL: https://hrm-production-gateway.thankfulriver-4edafef0.centralindia.azurecontainerapps.io/api
  FRONTEND_URL: https://brave-cliff-0a9fb0400.1.azurestaticapps.net

jobs:
  # ===========================================
  # BUILD & PUSH DOCKER IMAGES
  # ===========================================
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: tags
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      # ===========================================
      # Build API Gateway
      # ===========================================
      - name: Build API Gateway
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-api-gateway:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-api-gateway:latest \
            -f services/api-gateway/Dockerfile services/api-gateway
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-api-gateway --all-tags

      # ===========================================
      # Build Core Services (Auth, Tenant, Employee)
      # ===========================================
      - name: Build Auth Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-auth-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-auth-service:latest \
            -f services/auth-service/Dockerfile services/auth-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-auth-service --all-tags

      - name: Build Tenant Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-tenant-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-tenant-service:latest \
            -f services/tenant-service/Dockerfile services/tenant-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-tenant-service --all-tags

      - name: Build Employee Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-employee-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-employee-service:latest \
            -f services/employee-service/Dockerfile services/employee-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-employee-service --all-tags

      # ===========================================
      # Build HR Services (Attendance, Leave, Timesheet)
      # ===========================================
      - name: Build Attendance Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-attendance-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-attendance-service:latest \
            -f services/attendance-service/Dockerfile services/attendance-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-attendance-service --all-tags

      - name: Build Leave Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-leave-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-leave-service:latest \
            -f services/leave-service/Dockerfile services/leave-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-leave-service --all-tags

      - name: Build Timesheet Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-timesheet-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-timesheet-service:latest \
            -f services/timesheet-service/Dockerfile services/timesheet-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-timesheet-service --all-tags

      # ===========================================
      # Build Payroll Services
      # ===========================================
      - name: Build Payroll Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-payroll-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-payroll-service:latest \
            -f services/payroll-service/Dockerfile services/payroll-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-payroll-service --all-tags

      # ===========================================
      # Build Communication Services
      # ===========================================
      - name: Build Notification Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-notification-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-notification-service:latest \
            -f services/notification-service/Dockerfile services/notification-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-notification-service --all-tags

      # ===========================================
      # Build Workforce Services
      # ===========================================
      - name: Build Onboarding Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/hrm-onboarding-service:${{ steps.tags.outputs.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/hrm-onboarding-service:latest \
            -f services/onboarding-service/Dockerfile services/onboarding-service
          docker push ${{ env.ACR_LOGIN_SERVER }}/hrm-onboarding-service --all-tags

  # ===========================================
  # UPDATE CONTAINER APPS (Terraform-managed)
  # ===========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: production
      url: https://brave-cliff-0a9fb0400.1.azurestaticapps.net

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update API Gateway
        run: |
          az containerapp update \
            --name hrm-production-gateway \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/hrm-api-gateway:${{ needs.build-push.outputs.image_tag }}

      - name: Update Core Services
        run: |
          # Note: Terraform creates consolidated Container Apps
          # For now, update the gateway which handles routing
          echo "Core services are consolidated in Terraform-managed Container Apps"
          echo "Update hrm-production-core if using consolidated services"

      - name: Get Deployment URLs
        run: |
          echo "## Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          API_FQDN=$(az containerapp show --name hrm-production-gateway --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "pending")

          echo "- **Frontend (Static Web App)**: ${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway**: https://$API_FQDN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Apps Status" >> $GITHUB_STEP_SUMMARY
          az containerapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[].{Name:name, Status:properties.runningStatus}" -o table >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # DEPLOY FRONTEND TO STATIC WEB APP
  # ===========================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
          skip_app_build: true
