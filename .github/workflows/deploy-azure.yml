# ===========================================
# HRM SaaS Platform - Azure CI/CD Pipeline
# ===========================================
# Builds Docker images and deploys to Azure Container Apps

name: Deploy to Azure

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-gateway
          - auth-service
          - tenant-service
          - employee-service
          - attendance-service
          - leave-service
          - payroll-service
          - timesheet-service
          - notification-service
          - frontend

env:
  AZURE_RESOURCE_GROUP: hrm-rg
  ACR_NAME: hrmacr2024
  CONTAINER_APP_ENV: hrm-env
  LOCATION: eastus

jobs:
  # ===========================================
  # DETECT CHANGES
  # ===========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event.inputs.service }}" != "" ]; then
            if [ "${{ github.event.inputs.service }}" = "all" ]; then
              SERVICES="api-gateway auth-service tenant-service employee-service attendance-service leave-service payroll-service timesheet-service notification-service frontend"
            else
              SERVICES="${{ github.event.inputs.service }}"
            fi
          else
            SERVICES=""
            # Check each service directory for changes
            for dir in services/*/; do
              service=$(basename "$dir")
              if git diff --name-only HEAD~1 HEAD | grep -q "services/$service/"; then
                SERVICES="$SERVICES $service"
              fi
            done
            # Check frontend
            if git diff --name-only HEAD~1 HEAD | grep -q "frontend/"; then
              SERVICES="$SERVICES frontend"
            fi
            # If docker-compose changed, deploy all
            if git diff --name-only HEAD~1 HEAD | grep -q "docker-compose"; then
              SERVICES="api-gateway auth-service tenant-service employee-service attendance-service leave-service payroll-service timesheet-service notification-service frontend"
            fi
          fi
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Changed services: $SERVICES"

      - name: Create matrix
        id: matrix
        run: |
          SERVICES="${{ steps.changes.outputs.services }}"
          if [ -z "$SERVICES" ]; then
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          else
            JSON=$(echo $SERVICES | tr ' ' '\n' | jq -R . | jq -s '{service: .}' | jq -c .)
            echo "matrix=$JSON" >> $GITHUB_OUTPUT
          fi

  # ===========================================
  # BUILD & PUSH DOCKER IMAGES
  # ===========================================
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != ''
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: tags
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          DATE=$(date +'%Y%m%d-%H%M')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Build and Push - ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/hrm/${{ matrix.service }}:${{ steps.tags.outputs.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/hrm/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ===========================================
  # DEPLOY TO AZURE CONTAINER APPS
  # ===========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, build-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://${{ env.ACR_NAME }}.azurecontainerapps.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate image tag
        id: tags
        run: |
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create/Update Container Apps
        run: |
          SERVICES="${{ needs.detect-changes.outputs.services }}"
          IMAGE_TAG="${{ steps.tags.outputs.sha }}"
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"

          # Ensure resource group exists
          az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.LOCATION }} 2>/dev/null || true

          # Ensure Container Apps environment exists
          az containerapp env create \
            --name ${{ env.CONTAINER_APP_ENV }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} 2>/dev/null || true

          # Deploy each service
          for service in $SERVICES; do
            echo "Deploying $service..."

            # Set port based on service
            case $service in
              api-gateway) PORT=3000 ;;
              auth-service) PORT=3001 ;;
              tenant-service) PORT=3002 ;;
              employee-service) PORT=3003 ;;
              attendance-service) PORT=3004 ;;
              leave-service) PORT=3005 ;;
              payroll-service) PORT=3006 ;;
              timesheet-service) PORT=3024 ;;
              notification-service) PORT=3007 ;;
              frontend) PORT=80 ;;
              *) PORT=3000 ;;
            esac

            # Check if container app exists
            EXISTS=$(az containerapp show --name hrm-$service --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null || echo "")

            if [ -z "$EXISTS" ]; then
              # Create new container app
              az containerapp create \
                --name hrm-$service \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --environment ${{ env.CONTAINER_APP_ENV }} \
                --image $ACR_SERVER/hrm/$service:$IMAGE_TAG \
                --target-port $PORT \
                --ingress external \
                --registry-server $ACR_SERVER \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }} \
                --cpu 0.5 \
                --memory 1.0Gi \
                --min-replicas 1 \
                --max-replicas 3
            else
              # Update existing container app
              az containerapp update \
                --name hrm-$service \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --image $ACR_SERVER/hrm/$service:$IMAGE_TAG
            fi

            echo "✅ Deployed $service"
          done

      - name: Get Deployment URLs
        run: |
          echo "## Deployment URLs" >> $GITHUB_STEP_SUMMARY
          SERVICES="${{ needs.detect-changes.outputs.services }}"
          for service in $SERVICES; do
            URL=$(az containerapp show --name hrm-$service --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "pending")
            echo "- **$service**: https://$URL" >> $GITHUB_STEP_SUMMARY
          done

  # ===========================================
  # HEALTH CHECK
  # ===========================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Services Health
        run: |
          echo "Checking service health..."
          sleep 30

          # Get API gateway URL
          API_URL=$(az containerapp show --name hrm-api-gateway --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$API_URL" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$API_URL/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API Gateway is healthy"
            else
              echo "⚠️ API Gateway returned HTTP $HTTP_CODE"
            fi
          fi

          # Get frontend URL
          FRONTEND_URL=$(az containerapp show --name hrm-frontend --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$FRONTEND_URL" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$FRONTEND_URL || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Frontend is healthy"
            else
              echo "⚠️ Frontend returned HTTP $HTTP_CODE"
            fi
          fi

  # ===========================================
  # NOTIFY
  # ===========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "HRM Azure Deployment ${{ needs.deploy.result == 'success' && 'Successful' || 'Failed' }} - ${{ github.ref_name }}"
          to: udathak@gmail.com, director@candycodetech.com
          from: HRM CI/CD <noreply@hrm.com>
          body: |
            HRM Azure Deployment Report
            ===========================

            Status: ${{ needs.deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            Health Check: ${{ needs.health-check.result == 'success' && '✅ PASSED' || '⚠️ CHECK LOGS' }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
