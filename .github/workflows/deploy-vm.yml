# ===========================================
# HRM SaaS Platform - Deploy to VM
# ===========================================
# Builds Docker images and deploys to VM at 135.171.160.105

name: Deploy to VM

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-gateway
          - auth-service
          - tenant-service
          - employee-service
          - attendance-service
          - leave-service
          - payroll-service
          - timesheet-service
          - notification-service
          - onboarding-service
          - frontend

env:
  ACR_NAME: hrmproductionacr
  ACR_LOGIN_SERVER: hrmproductionacr.azurecr.io
  VM_HOST: 135.171.160.105
  VM_USER: ${{ secrets.VM_SSH_USER }}

jobs:
  # ===========================================
  # BUILD & PUSH DOCKER IMAGES
  # ===========================================
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine services to deploy
        id: services
        run: |
          if [ "${{ github.event.inputs.service }}" = "all" ] || [ -z "${{ github.event.inputs.service }}" ]; then
            SERVICES="api-gateway auth-service tenant-service employee-service attendance-service leave-service payroll-service notification-service onboarding-service timesheet-service frontend"
          else
            SERVICES="${{ github.event.inputs.service }}"
          fi
          echo "list=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to deploy: $SERVICES"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: tags
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Image tag: $SHA"

      - name: Build and Push Images
        run: |
          SERVICES="${{ steps.services.outputs.list }}"
          TAG="${{ steps.tags.outputs.sha }}"

          for service in $SERVICES; do
            echo "========================================="
            echo "Building $service..."
            echo "========================================="

            if [ "$service" = "frontend" ]; then
              CONTEXT="frontend"
              DOCKERFILE="frontend/Dockerfile"
              BUILD_ARGS="--build-arg VITE_API_URL=http://${{ env.VM_HOST }}/api"
            else
              CONTEXT="services/$service"
              DOCKERFILE="services/$service/Dockerfile"
              BUILD_ARGS=""
            fi

            docker build $BUILD_ARGS \
              -t ${{ env.ACR_LOGIN_SERVER }}/hrm/$service:$TAG \
              -t ${{ env.ACR_LOGIN_SERVER }}/hrm/$service:latest \
              -f $DOCKERFILE $CONTEXT

            docker push ${{ env.ACR_LOGIN_SERVER }}/hrm/$service:$TAG
            docker push ${{ env.ACR_LOGIN_SERVER }}/hrm/$service:latest

            echo "Pushed $service"
          done

  # ===========================================
  # DEPLOY TO VM
  # ===========================================
  deploy-vm:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: production
      url: http://135.171.160.105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VM
        run: |
          SERVICES="${{ needs.build-push.outputs.services }}"

          ssh -o StrictHostKeyChecking=no ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'ENDSSH'
            set -e
            cd /opt/hrm

            echo "========================================="
            echo "Logging into Azure Container Registry..."
            echo "========================================="
            az acr login --name hrmproductionacr

            echo "========================================="
            echo "Pulling latest images..."
            echo "========================================="
            docker-compose -f docker-compose.yml -f docker-compose.production.yml pull

            echo "========================================="
            echo "Restarting services..."
            echo "========================================="
            docker-compose -f docker-compose.yml -f docker-compose.production.yml up -d

            echo "========================================="
            echo "Cleaning up old images..."
            echo "========================================="
            docker image prune -f

            echo "========================================="
            echo "Deployment complete!"
            echo "========================================="
            docker-compose ps
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          echo "Checking API Gateway health..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.VM_HOST }}/api/health || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "API Gateway is responding (HTTP $HTTP_CODE)"
          else
            echo "Warning: API Gateway returned HTTP $HTTP_CODE"
          fi

          echo "Checking Frontend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.VM_HOST }}/ || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Frontend is healthy"
          else
            echo "Warning: Frontend returned HTTP $HTTP_CODE"
          fi

  # ===========================================
  # NOTIFY
  # ===========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-push, deploy-vm]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-vm.result }}" = "success" ]; then
            echo "### Status: Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Status: Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** http://135.171.160.105" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Services:** ${{ needs.build-push.outputs.services }}" >> $GITHUB_STEP_SUMMARY
