# ===========================================
# HRM SaaS Platform - CI/CD Pipeline for Azure
# ===========================================

name: HRM CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AZURE_RESOURCE_GROUP: hrm-production-rg
  AKS_CLUSTER_NAME: hrm-production-aks
  ACR_NAME: hrmproductionacr
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # BUILD & TEST
  # ===========================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - tenant-service
          - employee-service
          - attendance-service
          - leave-service
          - payroll-service
          - notification-service
          - reports-service
          - websocket-service
          - chat-service
          - analytics-service
          - document-service
          - integration-service
          - engagement-service
          - ai-chatbot-service
          - ai-ml-service
          - workforce-service
          - recruitment-service
          - localization-service
          - benefits-service
          - onboarding-service
          - compliance-service
          - expense-service
          - timesheet-service
          - asset-service
          - grievance-service
          - billing-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm install

      - name: Run linting
        working-directory: services/${{ matrix.service }}
        run: npm run lint --if-present

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present
        env:
          NODE_ENV: test

      - name: Build service
        working-directory: services/${{ matrix.service }}
        run: npm run build

  # ===========================================
  # BUILD FRONTEND
  # ===========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run linting
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ===========================================
  # SECURITY SCAN
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ===========================================
  # BUILD & PUSH DOCKER IMAGES
  # ===========================================
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, build-frontend, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - tenant-service
          - employee-service
          - attendance-service
          - leave-service
          - payroll-service
          - notification-service
          - reports-service
          - websocket-service
          - chat-service
          - analytics-service
          - document-service
          - integration-service
          - engagement-service
          - ai-chatbot-service
          - ai-ml-service
          - workforce-service
          - recruitment-service
          - localization-service
          - benefits-service
          - onboarding-service
          - compliance-service
          - expense-service
          - timesheet-service
          - asset-service
          - grievance-service
          - billing-service
          - frontend
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        if: matrix.service == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: tag
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/hrm/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_NAME }}.azurecr.io/hrm/${{ matrix.service }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/hrm/${{ matrix.service }}:${{ steps.tag.outputs.date }}-${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ===========================================
  # DEPLOY TO STAGING
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.hrm.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to AKS (Staging)
        run: |
          # Replace image tags in manifests
          export IMAGE_TAG=${{ steps.tag.outputs.tag }}
          export ACR_LOGIN_SERVER=${{ env.ACR_NAME }}.azurecr.io

          # Apply namespace and base configs
          kubectl apply -f infrastructure/kubernetes/base/namespace.yaml

          # Apply configmap for staging
          envsubst < infrastructure/kubernetes/base/configmap.yaml | kubectl apply -n hrm-staging -f -

          # Deploy services with staging namespace override
          for file in infrastructure/kubernetes/services/*.yaml; do
            envsubst < "$file" | sed 's/hrm-production/hrm-staging/g' | kubectl apply -f -
          done

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n hrm-staging --timeout=300s
          kubectl get pods -n hrm-staging

  # ===========================================
  # DEPLOY TO PRODUCTION
  # ===========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://hrm.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to AKS (Production)
        run: |
          # Replace image tags in manifests
          export IMAGE_TAG=${{ steps.tag.outputs.tag }}
          export ACR_LOGIN_SERVER=${{ env.ACR_NAME }}.azurecr.io

          # Apply namespace and base configs
          kubectl apply -f infrastructure/kubernetes/base/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/base/configmap.yaml

          # Apply secrets (should be managed via Azure Key Vault in production)
          # kubectl apply -f infrastructure/kubernetes/base/secrets.yaml

          # Deploy RabbitMQ
          kubectl apply -f infrastructure/kubernetes/base/rabbitmq.yaml

          # Deploy all services
          for file in infrastructure/kubernetes/services/*.yaml; do
            envsubst < "$file" | kubectl apply -f -
          done

          # Apply ingress
          kubectl apply -f infrastructure/kubernetes/base/ingress.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n hrm-production --timeout=300s
          kubectl rollout status deployment/frontend -n hrm-production --timeout=300s
          kubectl get pods -n hrm-production

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30

          # Get ingress IP
          INGRESS_IP=$(kubectl get ingress hrm-ingress -n hrm-production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          # Run basic health checks
          echo "Running smoke tests against $INGRESS_IP"
          # curl -f http://$INGRESS_IP/health || exit 1

  # ===========================================
  # NOTIFY ON COMPLETION
  # ===========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "HRM Deployment ${{ needs.deploy-production.result == 'success' && 'Successful' || 'Failed' }} - ${{ github.ref_name }}"
          to: udathak@gmail.com, director@candycodetech.com
          from: HRM CI/CD <noreply@hrm.com>
          body: |
            HRM Deployment Report
            =====================

            Status: ${{ needs.deploy-production.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
