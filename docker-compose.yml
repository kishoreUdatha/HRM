version: '3.8'

services:
  # ===========================================
  # INFRASTRUCTURE SERVICES
  # ===========================================

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hrm-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hrm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hrm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hrm_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hrm-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # MICROSERVICES
  # ===========================================

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: hrm-api-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - TENANT_SERVICE_URL=http://tenant-service:3002
      - EMPLOYEE_SERVICE_URL=http://employee-service:3003
      - ATTENDANCE_SERVICE_URL=http://attendance-service:3004
      - LEAVE_SERVICE_URL=http://leave-service:3005
      - PAYROLL_SERVICE_URL=http://payroll-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
      - REPORTS_SERVICE_URL=http://reports-service:3008
      - WEBSOCKET_SERVICE_URL=http://websocket-service:3009
      - CHAT_SERVICE_URL=http://chat-service:3010
      - ANALYTICS_SERVICE_URL=http://analytics-service:3011
      - DOCUMENT_SERVICE_URL=http://document-service:3012
      - INTEGRATION_SERVICE_URL=http://integration-service:3013
      - ENGAGEMENT_SERVICE_URL=http://engagement-service:3014
      - AI_CHATBOT_SERVICE_URL=http://ai-chatbot-service:3015
      - AI_ML_SERVICE_URL=http://ai-ml-service:3016
      - WORKFORCE_SERVICE_URL=http://workforce-service:3017
      - RECRUITMENT_SERVICE_URL=http://recruitment-service:3018
      - LOCALIZATION_SERVICE_URL=http://localization-service:3019
      - BENEFITS_SERVICE_URL=http://benefits-service:3020
      - ONBOARDING_SERVICE_URL=http://onboarding-service:3021
      - COMPLIANCE_SERVICE_URL=http://compliance-service:3022
      - EXPENSE_SERVICE_URL=http://expense-service:3023
      - TIMESHEET_SERVICE_URL=http://timesheet-service:3024
      - ASSET_SERVICE_URL=http://asset-service:3025
      - GRIEVANCE_SERVICE_URL=http://grievance-service:3026
      - BILLING_SERVICE_URL=http://billing-service:3027
      - CLIENT_URL=http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - auth-service
      - tenant-service
      - employee-service
    networks:
      - hrm-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hrm-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://admin:hrm_password_2024@mongodb:27017/hrm_auth?authSource=admin
      - JWT_ACCESS_SECRET=hrm_saas_access_secret_2024
      - JWT_REFRESH_SECRET=hrm_saas_refresh_secret_2024
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - RABBITMQ_URL=amqp://hrm_user:hrm_password@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrm-network

  # Tenant Service
  tenant-service:
