      - RABBITMQ_URL=amqp://hrm_user:hrm_password@rabbitmq:5672
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
      - EMAIL_FROM=HRM System <noreply@hrm.com>
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
