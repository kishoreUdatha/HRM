      context: ./services/benefits-service
      dockerfile: Dockerfile
    container_name: hrm-benefits-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3020
      - MONGODB_URI=mongodb://admin:hrm_password_2024@mongodb:27017/hrm_benefits?authSource=admin
      - RABBITMQ_URL=amqp://hrm_user:hrm_password@rabbitmq:5672
