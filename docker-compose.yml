  # Billing Service (Razorpay Integration, Subscriptions, Invoices)
  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: hrm-billing-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3027
      - MONGODB_URI=mongodb://admin:hrm_password_2024@mongodb:27017/hrm_billing?authSource=admin
