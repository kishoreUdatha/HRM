  # Frontend Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - hrm-network

networks:
  hrm-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
